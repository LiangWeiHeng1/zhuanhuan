<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>线路三直播</title>
  
  <style>
    body { background:#000; margin:0; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; overflow:hidden; font-family:sans-serif;}
    
    #player-container { width:100%; flex:1; position:relative; overflow:hidden; display: flex; justify-content: center; align-items: center;}
    #video { width:100%; height:100%; object-fit:contain; position: absolute; top:0; left:0;}
    
    /* 居中面板 */
    #center-panel {
      position: absolute;
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #444;
      border-radius: 12px;
      padding: 30px 50px;
      text-align: center;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* 倒计时区域 */
    #countdown-title { color: #fff; font-size: 18px; margin-bottom: 15px; }
    #countdown-box { 
      color: #00c853; 
      font-size: 40px; 
      font-weight: bold; 
      margin-bottom: 30px;
      font-family: monospace; 
    }
    
    /* 刷新按钮 */
    #refreshBtn { 
      padding: 12px 40px; 
      background: #1a3d96; 
      color: #fff; 
      border: 2px solid #5c85e6; 
      border-radius: 30px; 
      font-size: 18px; 
      cursor: pointer; 
      outline: none;
      transition: all 0.2s;
    }
    #refreshBtn:active { background: #0d2259; transform: scale(0.95); }
  </style>
  <script src="https://macaujc.com/js/NodePlayer.min.js"></script>
</head>
<body>
  
  <div id="player-container">
    <canvas id="video"></canvas>
    
    <!-- 居中控制面板 -->
    <div id="center-panel">
      <div id="countdown-title">距离 21:33 开播还有</div>
      <div id="countdown-box">--:--:--</div>
      <button id="refreshBtn">🔄 刷新重连</button>
    </div>
  </div>

  <script>
    // ================= 1. 永远在动的倒计时 =================
    function updateClock() {
      const now = new Date();
      const target = new Date();
      
      // 设定目标时间为当天的 21:33:00
      target.setHours(21, 33, 0, 0); 
      
      let diff = target.getTime() - now.getTime();

      // 【关键修复】如果现在的时间已经过了 21:33，就倒数明天的 21:33
      if (diff < 0) {
          target.setDate(target.getDate() + 1);
          diff = target.getTime() - now.getTime();
      }

      // 计算时分秒
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      
      // 格式化补零
      const pad = (num) => num.toString().padStart(2, '0');
      
      // 显示在页面上
      document.getElementById('countdown-box').innerText = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    
    // 立即执行一次
    updateClock();
    // 每一秒执行一次
    setInterval(updateClock, 1000);

    // ================= 2. 播放器逻辑 =================
    let player = null;
    const canvas = document.getElementById('video');
    const refreshBtn = document.getElementById('refreshBtn');
    const panel = document.getElementById('center-panel');
    const url = "https://play8398.lianwin88.com/live/mosixmark.flv";
    let resetTimer = null;

    function resetBtn() {
      refreshBtn.innerText = "🔄 刷新重连";
      refreshBtn.style.background = "#1a3d96";
      refreshBtn.style.cursor = "pointer";
    }

    function initPlayer() {
      refreshBtn.innerText = "⏳ 正在连接...";
      refreshBtn.style.background = "#555";
      refreshBtn.style.cursor = "not-allowed";

      // 3秒后强制恢复按钮
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        resetBtn();
      }, 3000);

      if (player) {
        try { player.stop(); player.clearView(); player = null; } catch (e) {}
      }
      
      player = new NodePlayer();
      player.setView(canvas);
      
      player.on('start', () => {
        panel.style.display = 'none';
        clearTimeout(resetTimer);
        resetBtn();
      });

      player.on('error', (e) => {
        panel.style.display = 'flex';
        clearTimeout(resetTimer);
        resetBtn();
      });

      player.start(url);
    }

    refreshBtn.addEventListener('click', () => {
      panel.style.display = 'flex';
      initPlayer();
    });

    initPlayer();
  </script>
</body>
</html>
