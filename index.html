<script>
// ================================================================
// 投注计算器核心逻辑
// ================================================================

const ZODIAC_COUNT = { '马': 5, '牛': 4, '虎': 4, '兔': 4, '龙': 4, '蛇': 4, '羊': 4, '猴': 4, '鸡': 4, '狗': 4, '猪': 4, '鼠': 4 };
const COMBO_MAP = { '二': 2, '三': 3, '四': 4, '五': 5 };

const ZODIAC_TO_NUMBERS = {
    '马': [1, 13, 25, 37, 49], '牛': [6, 18, 30, 42], '虎': [5, 17, 29, 41],
    '兔': [4, 16, 28, 40], '龙': [3, 15, 27, 39], '蛇': [2, 14, 26, 38],
    '羊': [12, 24, 36, 48], '猴': [11, 23, 35, 47], '鸡': [10, 22, 34, 46],
    '狗': [9, 21, 33, 45], '猪': [8, 20, 32, 44], '鼠': [7, 19, 31, 43]
};

const COLOR_TO_NUMBERS = {
    '红': [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
    '绿': [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49],
    '蓝': [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48]
};

function getSpecialColorNumbers(type) {
    const colorMap = {
        '红': [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
        '绿': [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49],
        '蓝': [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48]
    };
    const color = type.replace(/单|双/, '');
    const isOdd = type.includes('单');
    const numbers = colorMap[color] || [];
    return numbers.filter(n => (n % 2 === 1) === isOdd);
}

const ODD_NUMBERS = Array.from({ length: 25 }, (_, i) => i * 2 + 1);
const EVEN_NUMBERS = Array.from({ length: 24 }, (_, i) => (i + 1) * 2);
const BIG_NUMBERS = Array.from({ length: 25 }, (_, i) => i + 25);
const SMALL_NUMBERS = Array.from({ length: 24 }, (_, i) => i + 1);

function comb(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    if (k > n - k) k = n - k;
    let r = 1;
    for (let i = 1; i <= k; i++) { r = r * (n - i + 1) / i; }
    return Math.round(r);
}

const ODDS = {
    'special': 47, 'zhengma': 7, 'pingte_zodiac': 2, 'pingte_zodiac_ma': 1.8,
    'pingte_tail': 1.8, 'pingte_tail_0': 2,
    'combo_zodiac_2': 4, 'combo_zodiac_2_ma': 3.5,
    'combo_zodiac_3': 10, 'combo_zodiac_3_ma': 9,
    'combo_zodiac_4': 30, 'combo_zodiac_4_ma': 28,
    'combo_zodiac_5': 100, 'combo_zodiac_5_ma': 80,
    'combo_tail_2': 3, 'combo_tail_3': 7, 'combo_tail_4': 15,
    'not_hit_5': 2, 'not_hit_6': 2.5, 'not_hit_10': 4.5
};

function parseNotHit(line) {
    const match = line.match(/^([\d.、，,。\s\/\-#]+)(五不中|六不中|十不中)\s*(\d+)$/);
    if (!match) return null;
    const numStr = match[1];
    const type = match[2];
    const amount = parseInt(match[3]);
    const nums = numStr.match(/\d+/g);
    if (!nums || nums.length === 0) return null;
    const numbers = nums.map(Number);
    
    const isFive = type === '五不中';
    const isSix = type === '六不中';
    const isTen = type === '十不中';
    
    if (isFive && numbers.length !== 5) return { type: 'error', category: 'other', raw: line, display: '❌ 五不中需要5个数字，当前' + numbers.length + '个' };
    if (isSix && numbers.length !== 6) return { type: 'error', category: 'other', raw: line, display: '❌ 六不中需要6个数字，当前' + numbers.length + '个' };
    if (isTen && numbers.length !== 10) return { type: 'error', category: 'other', raw: line, display: '❌ 十不中需要10个数字，当前' + numbers.length + '个' };
    
    const typeName = isFive ? '五不中' : (isSix ? '六不中' : '十不中');
    const displayText = numbers.join(',') + ' ' + typeName + ' ' + amount + '元 (全不中才赢)';
    
    return {
        type: isFive ? 'not_hit_5' : (isSix ? 'not_hit_6' : 'not_hit_10'),
        category: 'other',
        numbers: numbers,
        amount: amount,
        unitPrice: amount,
        display: displayText,
        raw: line
    };
}

function calcNotHitWin(bet, result) {
    if (!result) return { winAmount: 0, detail: '无开奖结果' };
    const openCodes = result.codes || [];
    const allCodes = openCodes;
    const betNumbers = bet.numbers || [];
    const unitPrice = bet.unitPrice || bet.amount || 0;
    const hitNumbers = betNumbers.filter(num => allCodes.includes(num));
    const hitCount = hitNumbers.length;
    
    if (hitCount === 0) {
        const isFive = bet.type === 'not_hit_5';
        const isSix = bet.type === 'not_hit_6';
        const odds = isFive ? 2 : (isSix ? 2.5 : 4.5);
        const winAmount = unitPrice * odds;
        const typeName = isFive ? '五不中' : (isSix ? '六不中' : '十不中');
        return {
            winAmount: winAmount,
            detail: '✅ 全不中！' + betNumbers.join(',') + ' 均未开出 → ' + unitPrice + '×' + odds + '倍=' + winAmount + '元'
        };
    } else {
        const typeName = bet.type === 'not_hit_5' ? '五不中' : (bet.type === 'not_hit_6' ? '六不中' : '十不中');
        return {
            winAmount: 0,
            detail: '❌ 命中 ' + hitNumbers.join(',') + ' (' + hitCount + '个) → 不中'
        };
    }
}

function parseErSan(line) {
    const match = line.match(/^(复式)?(二中二|三中三)\s*([\d.、，,\s\-]+?)(?:各|\/)\s*(\d+)$/);
    if (!match) return null;
    const hasFuShi = match[1] !== undefined;
    const type = match[2];
    const numStr = match[3];
    const separator = line.includes('各') ? '各' : '/';
    const amount = parseInt(match[4]);
    const nums = numStr.match(/\d+/g);
    if (!nums || nums.length === 0) return null;
    const numbers = nums.map(Number);
    const n = type === '二中二' ? 2 : 3;
    let isSingle = false;
    let isMultiple = false;
    
    if (hasFuShi) {
        if (numbers.length <= n) return { type: 'error', category: 'other', raw: line, display: '❌ 复式' + type + '需要至少' + (n + 1) + '个数字，当前' + numbers.length + '个' };
        if (separator !== '各') return { type: 'error', category: 'other', raw: line, display: '❌ 复式必须用"各"分隔金额' };
        isMultiple = true;
    } else {
        if (numbers.length === n) {
            if (separator !== '/') return { type: 'error', category: 'other', raw: line, display: '❌ 单式' + type + '必须用"/"分隔金额' };
            isSingle = true;
        } else if (numbers.length > n) {
            if (separator !== '各') return { type: 'error', category: 'other', raw: line, display: '❌ 复式' + type + '必须用"各"分隔金额' };
            isMultiple = true;
        } else {
            return { type: 'error', category: 'other', raw: line, display: '❌ ' + type + '需要至少' + n + '个数字，当前' + numbers.length + '个' };
        }
    }
    
    let totalAmount = amount;
    if (isMultiple) {
        const totalGroups = comb(numbers.length, n);
        totalAmount = totalGroups * amount;
    }

    let displayText = '';
    if (isSingle) {
        displayText = '单式 ' + type + ' ' + numbers.join(',') + ' ' + separator + amount + '元 (必须全中)';
    } else {
        const totalGroups = comb(numbers.length, n);
        displayText = type + numbers.join(',') + '各' + amount + '，共' + totalGroups + '组×' + amount + '元=' + totalAmount + '元';
    }

    return {
        type: type === '二中二' ? 'erzhonger' : 'sanzhongsan',
        category: 'other',
        numbers: numbers, 
        amount: totalAmount,
        unitAmount: amount,
        n: n,
        isSingle: isSingle,
        isMultiple: isMultiple,
        display: displayText,
        raw: line
    };
}

function calcErSanWin(bet, result) {
    if (!result) return { winAmount: 0, detail: '无开奖结果' };
    const openCodes = result.codes || [];
    const pingMa = openCodes.slice(0, 6);
    const numbers = bet.numbers || [];
    const n = bet.n || 2;
    const odds = n === 2 ? 60 : 600;
    const unitAmount = bet.unitAmount || bet.amount || 0;
    const hitNumbers = numbers.filter(num => pingMa.includes(num));
    const hitCount = hitNumbers.length;
    
    if (bet.isSingle) {
        if (hitCount === n) {
            const win = unitAmount * odds;
            return { winAmount: win, detail: '全部命中 ' + hitNumbers.join(',') + ' → ' + unitAmount + '×' + odds + '倍=' + win };
        } else {
            return { winAmount: 0, detail: '未中奖(匹配' + hitCount + '/' + n + '个)' };
        }
    }
    
    if (bet.isMultiple) {
        if (hitCount >= n) {
            const groups = comb(hitCount, n);
            const win = groups * unitAmount * odds;
            return { winAmount: win, detail: '命中' + hitCount + '个 (' + hitNumbers.join(',') + ') → C(' + hitCount + ',' + n + ')=' + groups + '组 × ' + unitAmount + '×' + odds + '倍=' + win };
        } else {
            return { winAmount: 0, detail: '未中奖(匹配' + hitCount + '个)' };
        }
    }
    return { winAmount: 0, detail: '未知类型' };
}

function parseCombo(line) {
    let comboList = [];
    const allComboMatches = line.match(/([2-5二三四五]+)(?:连|有|友)/g);
    if (!allComboMatches || allComboMatches.length === 0) return null;
    
    for (const match of allComboMatches) {
        const comboStr = match.replace(/(?:连|有|友)/, '');
        for (const ch of comboStr) {
            if (COMBO_MAP[ch]) {
                const k = COMBO_MAP[ch];
                if (!comboList.includes(k)) comboList.push(k);
            } else {
                const k = parseInt(ch);
                if (k >= 2 && k <= 5 && !comboList.includes(k)) comboList.push(k);
            }
        }
    }
    
    if (comboList.length === 0) return null;
    let amtStr = '';
    const amtMatch = line.match(/(\d+)$/);
    if (amtMatch) { amtStr = amtMatch[1]; }
    
    let remainPart = line.replace(/([2-5二三四五]+)(?:连|有|友)/g, '');
    remainPart = remainPart.replace(/(\d+)$/, '');
    remainPart = remainPart.replace(/尾/g, '');
    remainPart = remainPart.replace(/[各组]/g, '');
    remainPart = remainPart.replace(/[、，,.\s。！？；;！?、…—·\t\n\r]+/g, '');
    
    let items = [];
    let itemType = '';
    const zodiacItems = remainPart.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g);
    if (zodiacItems && zodiacItems.length > 0) {
        items = zodiacItems;
        itemType = '生肖';
    } else {
        const tailNums = remainPart.match(/[\d一二三四五六七八九零]+/g);
        if (tailNums && tailNums.length > 0) {
            let tailArr = [];
            const cnMap = { '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
            for (const numStr of tailNums) {
                for (const ch of numStr) {
                    if (cnMap[ch] !== undefined) {
                        tailArr.push(cnMap[ch]);
                    } else {
                        const d = parseInt(ch);
                        if (!isNaN(d)) tailArr.push(d);
                    }
                }
            }
            items = tailArr;
            itemType = '尾数';
        }
    }
    
    if (items.length === 0) return null;
    const n = items.length;
    let unitPrice = 1;
    if (amtStr) { unitPrice = parseInt(amtStr); }
    const validCombos = comboList.filter(k => k <= n);
    if (validCombos.length === 0) return null;
    
    let totalGroups = 0;
    let detailParts = [];
    for (const k of validCombos) {
        const c = comb(n, k);
        totalGroups += c;
        const name = ({ 2: '二', 3: '三', 4: '四', 5: '五' }[k]) + '连';
        detailParts.push(name + c + '组');
    }
    const totalAmount = totalGroups * unitPrice;
    const detailStr = detailParts.join(' + ');
    return {
        type: 'combo', category: 'other',
        items: items, itemType: itemType, comboList: validCombos,
        unitPrice: unitPrice, groups: totalGroups, amount: totalAmount,
        display: detailStr + '，共 ' + totalGroups + ' 组 × ' + unitPrice + '元 = ' + totalAmount + '元',
        raw: line
    };
}

function parseSpecial(line) {
    const match = line.match(/^(红单|红双|绿单|绿双|蓝单|蓝双|单|双|大|小|红|绿|蓝)(?:各|各数|各号|各码)?\s*(\d+)/);
    if (!match) return null;
    const type = match[1];
    const price = parseInt(match[2]);
    let items = [];
    let itemType = '';
    if (type === '单') { items = ODD_NUMBERS; itemType = '单双'; }
    else if (type === '双') { items = EVEN_NUMBERS; itemType = '单双'; }
    else if (type === '大') { items = BIG_NUMBERS; itemType = '大小'; }
    else if (type === '小') { items = SMALL_NUMBERS; itemType = '大小'; }
    else if (type === '红') { items = COLOR_TO_NUMBERS['红']; itemType = '颜色'; }
    else if (type === '绿') { items = COLOR_TO_NUMBERS['绿']; itemType = '颜色'; }
    else if (type === '蓝') { items = COLOR_TO_NUMBERS['蓝']; itemType = '颜色'; }
    else if (['红单', '红双', '绿单', '绿双', '蓝单', '蓝双'].includes(type)) {
        items = getSpecialColorNumbers(type);
        itemType = '颜色单双';
    }
    if (items.length === 0) return null;
    const total = items.length * price;
    return {
        type: 'expand', category: 'special',
        items: items, itemType: itemType, unitPrice: price,
        count: items.length, amount: total,
        display: '共 ' + items.length + ' 个号码 × ' + price + '元 = ' + total + '元',
        raw: line
    };
}

function autoSplitPureNumberLines(text) {
    if (!text) return text;
    var lines = text.split('\n');
    var result = [];

    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) { result.push(''); continue; }

        var isPureNumberLine = /各/.test(line);
        if (/各[^\d]/.test(line) && !/各组/.test(line)) {
            result.push(line);
            continue;
        }
        if (!isPureNumberLine) {
            result.push(line);
            continue;
        }

        var splitLine = line.replace(
            /各(\d+)(?=[.、，,\s\/\-#号]|$)/g,
            function(match, amount, offset, str) {
                var rest = str.slice(offset + match.length);
                if (!rest || !rest.trim()) return match;
                return match + '\n';
            }
        );

        var parts = splitLine.split('\n').map(function(s) {
            return s.trim();
        }).filter(function(s) {
            return s !== '';
        });

        result = result.concat(parts);
    }
    return result.join('\n');
}

function buildSpecialStats(betList) {
    const stat = new Array(50).fill(0);
    for (const bet of betList) {
        if (bet.category !== 'special') continue;
        if (bet.type !== 'expand') continue;
        const items = bet.items || [];
        const price = bet.unitPrice || 0;
        if (price <= 0) continue;
        for (const num of items) {
            if (num >= 1 && num <= 49) {
                stat[num] += price;
            }
        }
    }
    return stat;
}

function pasteAndAppend() {
    if (window.jsAndroidBridge && window.jsAndroidBridge.getClipboardText) {
        try {
            var text = window.jsAndroidBridge.getClipboardText();
            if (text && text.trim()) {
                appendToInput(text.trim());
                return;
            }
        } catch (e) {}
    }

    if (window.AndroidClipboard && window.AndroidClipboard.getText) {
        try {
            var text = window.AndroidClipboard.getText();
            if (text && text.trim()) {
                appendToInput(text.trim());
                return;
            }
        } catch (e) {}
    }

    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
            .then(function(text) {
                if (text && text.trim()) {
                    appendToInput(text.trim());
                }
            })
            .catch(function() {
                alert('无法读取剪贴板，请长按输入框手动粘贴');
            });
        return;
    }

    alert('无法读取剪贴板，请长按输入框手动粘贴');
}

function appendToInput(text) {
    var input = document.getElementById("betInput");
    var current = input.value;
    var separator = (current && current.trim() !== "") ? "\n" : "";
    var merged = current + separator + text;

    input.value = autoSplitPureNumberLines(merged);

    input.dispatchEvent(new Event("input"));
    input.scrollTop = input.scrollHeight;
    autoResizeInput();
    calcBets();
}
function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
}

function createNumberBox(num, zodiac, wave, isPlaceholder) {
    if (isPlaceholder === undefined) isPlaceholder = false;
    const box = document.createElement('div');
    const colorMap = { 'red': 'red-ball', 'green': 'green-ball', 'blue': 'blue-ball' };
    const ballClass = colorMap[wave] || 'blue-ball';
    box.className = 'number-box ' + (isPlaceholder ? 'placeholder' : ballClass);
    box.innerHTML = '<div class="num">' + (isPlaceholder ? '?' : String(num).padStart(2, '0')) + '</div><div class="draw-txt">' + (isPlaceholder ? '--' : zodiac) + '</div>';
    return box;
}

function makeRefreshBtn(type) {
    var btn = document.createElement('div');
    btn.className = 'number-box refresh-box';
    btn.innerHTML = '<div class="refresh-icon">🔄</div><div class="refresh-text">刷新</div>';

    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        this.innerHTML = '<div class="refresh-icon">⏳</div><div class="refresh-text">加载</div>';
        this.style.opacity = '0.6';
        this.style.pointerEvents = 'none';
        var self = this;

        if (type === 'mo') {
            fetchAndDisplayLottery(true, true).finally(function() {
                self.innerHTML = '<div class="refresh-icon">🔄</div><div class="refresh-text">刷新</div>';
                self.style.opacity = '1';
                self.style.pointerEvents = 'auto';
            });
        }
    });
    return btn;
}

async function fetchAndDisplayLottery(force, skipAnimation) {
    if (force === undefined) force = false;
    if (skipAnimation === undefined) skipAnimation = false;
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('网络请求失败');
        const data = await response.json();
        if (!data || data.length === 0) throw new Error('未获取到数据');

        const item = data[0];
        const openCode = item.openCode || '';
        const wave = item.wave || '';
        const zodiac = item.zodiac || '';
        const period = item.expect || '';
        const openTime = item.openTime || '';

        const now = new Date();
        const currentTotalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const clearTime = CLEAR_HOUR * 3600 + CLEAR_MINUTE * 60;
        const drawTime = DRAW_HOUR * 3600 + DRAW_MINUTE * 60;

        if (currentTotalSec < clearTime) {
            if (openCode && openCode.trim() !== '') {
                const codes = openCode.split(',').map(function(s) { return parseInt(s.trim()); });
                const waves = wave.split(',').map(function(s) { return s.trim().toLowerCase(); });
                const zodiacs = zodiac.split(',').map(function(s) { return s.trim(); });
                if (codes.length >= 7) {
                    if (period !== lastPeriodCache || force) {
                        lastPeriodCache = period;
                        displayAllNumbers(codes, waves, zodiacs, period, openTime);
                        setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                        calcBets();
                    }
                    return true;
                }
            }
            renderPlaceholders();
            return false;
        }

        if (currentTotalSec >= clearTime && currentTotalSec < drawTime) {
            if (!hasClearedForNewDraw) {
                hasClearedForNewDraw = true;
                renderPlaceholders();
                lotteryDateEl.textContent = '📅 等待新期开奖...';
                lotteryPeriodEl.textContent = '——';
                setLotteryResult(null);
                calcBets();
            }
            return false;
        }

        if (currentTotalSec >= drawTime) {
            if (openCode && openCode.trim() !== '') {
                const codes = openCode.split(',').map(function(s) { return parseInt(s.trim()); });
                const waves = wave.split(',').map(function(s) { return s.trim().toLowerCase(); });
                const zodiacs = zodiac.split(',').map(function(s) { return s.trim(); });
                if (codes.length >= 7) {
                    if (period !== lastPeriodCache || force) {
                        lastPeriodCache = period;
                        if (skipAnimation || isDrawTriggered) {
                            displayAllNumbers(codes, waves, zodiacs, period, openTime);
                        } else {
                            displayNumbersOneByOne(codes, waves, zodiacs, period, openTime);
                        }
                        setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                        hasClearedForNewDraw = false;
                        isDrawTriggered = true;
                        calcBets();
                        if (pollingTimer) {
                            clearInterval(pollingTimer);
                            pollingTimer = null;
                            isPolling = false;
                            console.log('✅ 开奖完成，轮询已停止');
                        }
                        return true;
                    } else {
                        const isShowingPlaceholder = document.getElementById('m1').textContent === '?';
                        if (isShowingPlaceholder) {
                            displayAllNumbers(codes, waves, zodiacs, period, openTime);
                            setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                            calcBets();
                        }
                        return true;
                    }
                }
            }
            return false;
        }
        return false;
    } catch (error) {
        console.error('获取开奖信息失败:', error);
        console.error('加载开奖信息失败：' + error.message);
        return false;
    }
}

function startPolling() {
    if (isPolling) return;
    isPolling = true;
    console.log('🔄 开始轮询开奖数据...');
    if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
    }
    pollingTimer = setInterval(async function() {
        const success = await fetchAndDisplayLottery();
        if (isDrawTriggered && success) {
            clearInterval(pollingTimer);
            pollingTimer = null;
            isPolling = false;
            console.log('✅ 开奖完成，轮询已停止');
        }
    }, RETRY_INTERVAL);
    fetchAndDisplayLottery().then(function(success) {
        if (isDrawTriggered && success) {
            clearInterval(pollingTimer);
            pollingTimer = null;
            isPolling = false;
            console.log('✅ 开奖完成，轮询已停止');
        }
    });
}

function scheduler() {
    const now = new Date();
    const currentTotalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const clearTime = CLEAR_HOUR * 3600 + CLEAR_MINUTE * 60;
    const drawTime = DRAW_HOUR * 3600 + DRAW_MINUTE * 60;
    if (currentTotalSec < clearTime) {
        if (!window._lotteryLoaded) {
            fetchAndDisplayLottery();
            window._lotteryLoaded = true;
        }
        return;
    }
    if (currentTotalSec >= clearTime && currentTotalSec < drawTime) {
        if (!isPolling && !isDrawTriggered) { startPolling(); }
        return;
    }
    if (currentTotalSec >= drawTime) {
        if (!isDrawTriggered) { if (!isPolling) { startPolling(); } }
    }
}

let historyRecords = [];

function loadHistoryRecords() {
    try {
        const saved = localStorage.getItem('betHistoryRecords');
        if (saved) {
            historyRecords = JSON.parse(saved);
            const today = new Date().toDateString();
            historyRecords = historyRecords.filter(r => {
                const recordDate = new Date(r.timestamp).toDateString();
                return recordDate === today;
            });
            saveHistoryRecords();
        }
    } catch (e) {
        historyRecords = [];
    }
    renderHistoryRecords();
}

function saveHistoryRecords() {
    try {
        localStorage.setItem('betHistoryRecords', JSON.stringify(historyRecords));
    } catch (e) {}
}

function saveCurrentRecord() {
    const input = document.getElementById('betInput');
    const content = input.value.trim();
    if (!content) {
        alert('输入框为空，没有可保存的内容');
        return;
    }
    const box = document.getElementById('resultBox');
    const resultText = box ? box.innerText : '';
    
    const record = {
        timestamp: Date.now(),
        timeStr: new Date().toLocaleString('zh-CN'),
        content: content,
        resultText: resultText,
        count: history.length
    };
    
    historyRecords.unshift(record);
    saveHistoryRecords();
    renderHistoryRecords();
    
    const btn = document.getElementById('saveHistoryBtn');
    btn.textContent = '✅ 已保存';
    setTimeout(() => { btn.textContent = '💾 保存'; }, 1500);
}

function renderHistoryRecords() {
    const box = document.getElementById('historyRecords');
    if (!box) return;
    
    if (historyRecords.length === 0) {
        box.innerHTML = '<div style="font-size:13px;color:#8895aa;text-align:center;padding:8px 0;">暂无保存记录</div>';
        return;
    }
    
    let html = '';
    for (let i = 0; i < historyRecords.length; i++) {
        const r = historyRecords[i];
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:13px;">';
        html += '<span style="color:#4a5a72;">' + r.timeStr + '</span>';
        html += '<div style="display:flex;gap:6px;">';
        html += '<button onclick="window.viewRecord(' + i + ')" style="font-size:12px;padding:3px 8px;border:1px solid #dce1e8;border-radius:4px;background:#fff;cursor:pointer;">查看</button>';
        html += '<button onclick="window.copyRecord(' + i + ')" style="font-size:12px;padding:3px 8px;border:1px solid #dce1e8;border-radius:4px;background:#fff;cursor:pointer;">复制</button>';
        html += '<button onclick="window.deleteRecord(' + i + ')" style="font-size:12px;padding:3px 8px;border:1px solid #dce1e8;border-radius:4px;background:#fff;cursor:pointer;">删除</button>';
        html += '</div>';
        html += '</div>';
    }
    box.innerHTML = html;
}

function viewRecord(index) {
    const r = historyRecords[index];
    if (!r) return;
    
    let msg = '【投注内容】\n' + r.content + '\n\n【计算结果】\n' + r.resultText;
    
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML = '<div style="background:#fff;border-radius:12px;padding:16px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<span style="font-weight:600;font-size:15px;">📜 ' + r.timeStr + '</span>' +
        '<button onclick="this.closest(\'.ds-modal\').remove()" style="font-size:13px;padding:4px 10px;border:1px solid #dce1e8;border-radius:6px;background:#fff;cursor:pointer;">关闭</button>' +
        '</div>' +
        '<div style="font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.8;">' + msg.replace(/</g, '&lt;') + '</div>' +
        '</div>';
    modal.className = 'ds-modal';
    modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.remove();
    });
    document.body.appendChild(modal);
}

function copyRecord(index) {
    const r = historyRecords[index];
    if (!r) return;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(r.content).then(() => {
            alert('已复制投注内容');
        }).catch(() => {
            fallbackCopy(r.content);
            alert('已复制投注内容');
        });
    } else {
        fallbackCopy(r.content);
        alert('已复制投注内容');
    }
}

function deleteRecord(index) {
    historyRecords.splice(index, 1);
    saveHistoryRecords();
    renderHistoryRecords();
}

function clearHistory() {
    historyRecords = [];
    saveHistoryRecords();
    renderHistoryRecords();
}

function checkNewDay() {
    const now = new Date();
    const today = now.toDateString();
    
    if (window._lastDay && window._lastDay !== today) {
        historyRecords = [];
        saveHistoryRecords();
        renderHistoryRecords();
        console.log('🌅 新的一天，历史记录已清空');
    }
    window._lastDay = today;
}

var isPlayingLive = false;

// 1. 获取最新地址并播放的函数
function fetchAndPlayLive() {
    if (isPlayingLive) return;
    isPlayingLive = true;
    
    var playerDiv = document.getElementById('myLivePlayer');
    playerDiv.innerHTML = '<span style="font-size:16px;">正在获取最新直播线路...</span>';

    // 向他的接口请求最新地址（macau代表澳门）
    fetch('https://k0hd4zu41m6rj.490477.cyou/api/o/livestream/url?lt=macau')
        .then(res => res.json())
        .then(data => {
            // 如果接口返回了数据
            if (data && data.data) {
                // ⚠️ 注意：这里通常需要解密(decryptData)，但如果他接口没加密，可能是明文
                // 为了保险，我们尝试解析一下
                var url = data.data;
                
                // 如果返回的是密文，这里可能会报错，那我们直接用默认的兜底播放器
                try {
                    // 如果你发现接口返回的是加密的一串乱码，那就只能放弃接口
                    // 这里我们尝试用他的纯净播放器页面去拉流
                    var playerUrl = 'https://zhibo.zhibodiaoyong.com/player.html?url=' + url;
                    renderVideo(playerUrl);
                } catch (e) {
                    console.log("接口解析失败，尝试使用默认地址");
                    useDefaultPlayer();
                }
            } else {
                // 接口没给地址，说明没到时间或者服务器空了，用默认的
                useDefaultPlayer();
            }
        })
        .catch(err => {
            console.log("跨域或请求失败，直接使用默认地址:", err);
            useDefaultPlayer();
        });
}

// 4. 倒计时及触发逻辑
setInterval(function() {
    var countdownEl = document.getElementById('liveCountdown');
    if (!countdownEl) return;

    var now = new Date();
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 21, 32, 0);
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 21, 36, 0);

    // 判断是否在直播时间
    if (now >= target && now < end) {
        countdownEl.innerHTML = '🔴 直播正在进行中...';
        countdownEl.style.color = '#2e7d32';
        
        if (!isPlayingLive) {
            fetchAndPlayLive();
        }
        return;
    }

    // 过了时间算明天
    if (now >= target) {
        target.setDate(target.getDate() + 1);
    }

    var diff = target - now;
    var h = Math.floor(diff / (1000 * 60 * 60));
    var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var s = Math.floor((diff % (1000 * 60)) / 1000);

    h = h < 10 ? '0' + h : h;
    m = m < 10 ? '0' + m : m;
    s = s < 10 ? '0' + s : s;

    countdownEl.innerHTML = '距离今晚 21:32 直播开始还有：<span style="color:#ff0000;">' + h + '</span> 时 <span style="color:#ff0000;">' + m + '</span> 分 <span style="color:#ff0000;">' + s + '</span> 秒';
    countdownEl.style.color = '#1a2332';
    
    // 如果直播结束，重置
    if (isPlayingLive && now >= end) {
        isPlayingLive = false;
        document.getElementById('myLivePlayer').innerHTML = '<span style="font-size:16px;">等待直播开始...</span>';
    }

}, 1000);
